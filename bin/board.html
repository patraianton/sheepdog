<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sheepdog</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #080d13;
    --deck: #0d141d;
    --panel: #111b26;
    --panel-hi: #172433;
    --panel-low: #0a1119;
    --line: #253445;
    --line-hot: #40546a;
    --ink: #e5edf5;
    --ink-mid: #9cafc1;
    --ink-dim: #617487;
    --blocked: #ff5c5f;
    --done: #ffb44a;
    --working: #35d6a0;
    --idle: #718397;
    --unknown: #53606f;
    --focus: #78ddff;
    --note: #ffd166;
    --violet: #b99cff;
    --ui: "Avenir Next Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
    --body: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif;
    --telemetry: Menlo, Consolas, "Cascadia Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr);
    min-width: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% -20%, #183047 0, transparent 38rem),
      linear-gradient(180deg, #0a1119 0, var(--bg) 100%);
    color: var(--ink);
    font-family: var(--body);
    font-size: 13px;
  }

  button { font: inherit; }

  .command-deck {
    position: relative;
    z-index: 5;
    display: grid;
    /* The readout is sized by its own text; the chip strip takes what is left
       and wraps inside it — so a crowded deck costs a chip row, not the
       timestamp at the end of the readout. */
    grid-template-columns: auto auto auto minmax(0, 1fr);
    grid-template-areas:
      "brand views readout filters";
    align-items: center;
    gap: 10px 14px;
    min-width: 0;
    padding: 9px 12px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #121c28 0%, #0c141d 100%);
    box-shadow: 0 8px 24px #0008;
  }
  /* Team and Other carry no direction chips. Their row leaves the deck
     altogether — an empty track still costs its gap, and that gap read as a
     blank band under the tabs. */
  .command-deck.no-filters {
    grid-template-columns: auto auto minmax(0, 1fr);
    grid-template-areas: "brand views readout";
  }
  #filters:empty { display: none; }
  .brand {
    grid-area: brand;
    min-width: 120px;
    line-height: 1;
  }
  .brand strong {
    display: block;
    font-family: var(--ui);
    font-size: 19px;
    font-weight: 900;
    letter-spacing: .16em;
    text-transform: uppercase;
  }
  .brand small {
    display: block;
    margin-top: 4px;
    color: var(--ink-dim);
    font-family: var(--telemetry);
    font-size: 8px;
    letter-spacing: .15em;
    text-transform: uppercase;
  }

  #views {
    grid-area: views;
    display: flex;
    min-width: 0;
    border: 1px solid var(--line);
    background: #080e15;
  }
  .view-tab {
    min-height: 34px;
    display: grid;
    grid-template-columns: auto auto;
    align-items: center;
    gap: 8px;
    min-width: 76px;
    padding: 4px 9px;
    border: 0;
    border-right: 1px solid var(--line);
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    font-family: var(--ui);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .09em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .view-tab:last-child { border-right: 0; }
  .view-tab:hover { color: var(--ink); background: #182331; }
  .view-tab.on {
    color: var(--ink);
    background: linear-gradient(180deg, #253548, #172331);
    box-shadow: inset 0 3px 0 var(--focus);
  }
  .view-tab .count {
    min-width: 24px;
    padding: 2px 4px;
    background: #071019;
    color: var(--ink-mid);
    font-family: var(--telemetry);
    font-size: 10px;
    text-align: center;
  }
  .view-tab.deep-toggle { border-left: 1px solid var(--line); }
  .view-tab.deep-toggle.on {
    color: var(--focus);
    background: linear-gradient(180deg, #143444, #0e2431);
    box-shadow: inset 0 3px 0 var(--focus);
  }

  /* Deep focus: a flat grid of only the picked cards. */
  .focus-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 8px;
    padding: 8px;
  }
  .focus-empty { padding: 30px 16px; color: var(--ink-dim); font-size: 12px; }

  #readout-zone {
    grid-area: readout;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  #readout {
    min-width: 0;
    overflow: hidden;
    color: var(--ink-dim);
    font-family: var(--telemetry);
    font-size: 9px;
    letter-spacing: .035em;
    line-height: 1.55;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #readout strong { color: var(--working); font-weight: 600; }
  #readout strong.lavish-total { color: #f2a7e3; }
  .misc-note.lavish-note { color: #f2a7e3; cursor: pointer; }
  .misc-note.lavish-note:hover { color: #ffd1f4; }
  #error {
    display: none;
    flex: none;
    max-width: 50%;
    overflow: hidden;
    padding: 3px 8px;
    border: 1px solid #7b3c43;
    background: #31181c;
    color: #ff9da0;
    font-family: var(--telemetry);
    font-size: 9px;
    letter-spacing: .04em;
    text-overflow: ellipsis;
    text-transform: uppercase;
    white-space: nowrap;
  }

  #filters {
    grid-area: filters;
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: flex-end;
    gap: 4px;
    min-width: 0;
  }
  /* Chips never shrink below their own label: they wrap to another row
     instead, and a label too long even for a whole row ends in an ellipsis. */
  .filter-key {
    height: 28px;
    display: inline-flex;
    flex: none;
    align-items: center;
    gap: 6px;
    max-width: 100%;
    min-width: 0;
    padding: 3px 7px;
    border: 1px solid var(--line);
    border-radius: 1px;
    background: #0b121a;
    color: var(--ink-dim);
    cursor: pointer;
    font-family: var(--ui);
    font-size: 9px;
    font-weight: 800;
    letter-spacing: .055em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .filter-key:hover { color: var(--ink); border-color: var(--line-hot); }
  .filter-key.on { color: var(--ink); background: #1b2a39; border-color: #526a80; }
  .filter-key .lamp { width: 4px; height: 14px; flex: none; background: var(--dir, var(--ink-dim)); }
  .filter-key .filter-name {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  #board {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    scrollbar-width: thin;
    scrollbar-color: #32465a #0a1017;
  }
  #board.kanban {
    display: grid;
    grid-template-columns: repeat(5, minmax(220px, 1fr));
    align-items: stretch;
    gap: 8px;
    padding: 8px 10px 12px;
  }
  #board.list {
    display: block;
    padding: 10px max(10px, calc((100vw - 1080px) / 2)) 28px;
  }

  .flight-column {
    --state: var(--unknown);
    container-type: inline-size;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border: 1px solid #1d2a38;
    background: #091018b8;
  }
  .column-head {
    position: relative;
    min-height: 57px;
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    padding: 7px 8px;
    overflow: hidden;
    border-bottom: 1px solid color-mix(in srgb, var(--state) 45%, var(--line));
    background:
      linear-gradient(105deg, color-mix(in srgb, var(--state) 24%, #101923) 0 58%, #101923 58%);
  }
  .column-head::before {
    content: "";
    position: absolute;
    inset: 0 0 auto;
    height: 4px;
    background: var(--state);
    box-shadow: 0 0 15px color-mix(in srgb, var(--state) 65%, transparent);
  }
  .state-glyph {
    width: 30px;
    height: 30px;
    display: grid;
    place-items: center;
    border: 1px solid color-mix(in srgb, var(--state) 70%, #fff0);
    background: color-mix(in srgb, var(--state) 13%, #091018);
    color: var(--state);
    font-family: var(--ui);
    font-size: 17px;
    font-weight: 900;
  }
  .column-title { min-width: 0; }
  /* A narrow column wraps the title to a second line instead of dropping the
     two words that carry the meaning ("BLOCKED — NEEDS YOU"). */
  .column-title strong {
    display: -webkit-box;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 900;
    letter-spacing: .055em;
    line-height: 1.1;
    overflow-wrap: anywhere;
    text-transform: uppercase;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .column-title small {
    display: block;
    margin-top: 4px;
    color: color-mix(in srgb, var(--state) 75%, var(--ink-mid));
    font-family: var(--telemetry);
    font-size: 8px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .column-count {
    min-width: 32px;
    color: var(--state);
    font-family: var(--telemetry);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
    text-align: right;
  }
  .column-list {
    min-height: 0;
    display: flex;
    flex: 1;
    flex-direction: column;
    gap: 6px;
    overflow-y: auto;
    padding: 6px;
    scrollbar-width: thin;
    scrollbar-color: #2f4356 transparent;
  }

  .flight-card {
    --state: var(--unknown);
    --dir-color: #3b4d60;
    position: relative;
    flex: none;
    min-width: 0;
    overflow: hidden;
    border: 1px solid #2a3949;
    border-radius: 2px;
    background:
      linear-gradient(160deg, #172331 0, #101923 58%, #0d151f 100%);
    box-shadow: 0 4px 12px #0005;
    cursor: pointer;
  }
  /* The direction accent sits on the card body, not on the card, so a focused
     card's cyan banner keeps its own top edge instead of being painted over. */
  .card-body::before {
    content: "";
    position: absolute;
    z-index: 1;
    inset: 0 auto auto 0;
    width: 52px;
    height: 3px;
    background: var(--dir-color);
  }
  .flight-card:hover { border-color: #4a6074; }
  .flight-card.unknown-card { opacity: .62; filter: saturate(.72); }
  .flight-card.alarm-card {
    border-color: var(--blocked);
    box-shadow: 0 0 0 1px #ff5c5f55, 0 4px 14px #0006;
  }
  .flight-card.star-live {
    border-color: var(--working);
    box-shadow: 0 0 0 1px #35d17e55, 0 4px 16px #0006;
  }
  .flight-card.focused {
    border-color: var(--focus);
    box-shadow: 0 0 0 1px #78ddff, 0 0 25px #3cbde83d;
  }
  .focus-banner {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    padding: 4px 7px;
    background: var(--focus);
    color: #07121a;
    font-family: var(--ui);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .15em;
    line-height: 1.2;
    text-transform: uppercase;
  }
  .focus-banner span:last-child {
    overflow: hidden;
    font-family: var(--telemetry);
    font-size: 7px;
    letter-spacing: .08em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-body { position: relative; padding: 7px; }
  .card-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 6px;
    min-width: 0;
  }
  .identity {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr);
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .tail-number {
    width: 30px;
    min-height: 28px;
    display: grid;
    place-items: center;
    border: 1px solid #3a4b5d;
    background: #0b131c;
    color: var(--ink-mid);
    font-family: var(--telemetry);
    font-size: 10px;
    font-weight: 700;
  }
  .label-stack { min-width: 0; }
  .session-label {
    display: block;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--ui);
    font-size: 13px;
    font-weight: 900;
    letter-spacing: .015em;
    line-height: 1.12;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .affil {
    display: block;
    margin-top: 3px;
    overflow: hidden;
    color: var(--ink-dim);
    font-family: var(--telemetry);
    font-size: 7.5px;
    letter-spacing: .025em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Distinct shapes of belonging: a tab names its main window, a linked
     worktree names its parent repo (TREE), a plain checkout its repo (REPO).
     Plain-text prefixes — glyphs outside the monospace stack render as
     mis-sized emoji. */
  .affil-window::before { content: "WINDOW / "; color: #425467; }
  .affil-tree::before { content: "TREE / "; color: #3d5a50; }
  .affil-repo::before { content: "REPO / "; color: #425467; }

  .control-rack {
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-end;
    gap: 2px;
  }
  .control {
    height: 23px;
    min-width: 23px;
    display: inline-grid;
    place-items: center;
    padding: 0 4px;
    border: 1px solid #35475a;
    border-radius: 1px;
    background: #0a121a;
    color: var(--ink-dim);
    cursor: pointer;
    font-family: var(--telemetry);
    font-size: 8px;
    font-weight: 700;
    line-height: 1;
    user-select: none;
  }
  .control:hover { color: var(--ink); border-color: #60778c; background: #182433; }
  .control.star-on { color: var(--note); border-color: #6f6135; }
  .control.p1 { color: #ff8d8f; border-color: #744347; background: #28171b; }
  .control.p2 { color: #ffc878; border-color: #6c5936; }
  .control.p3 { color: #aebdca; }
  .control.kind-temp { color: #79d9ef; }
  .control.kind-cron { color: #efc06a; }
  .control.kind-ongoing { color: #b9a8ec; }
  .control.role-run { color: #35d6a0; border-color: #2c6a55; }
  .control.role-tool { color: #f5c744; border-color: #6c5936; }
  .control.role-parked { color: #8fa3b6; }
  .control.focuspick-on { color: #07121a; background: var(--focus); border-color: var(--focus); }
  .control.date-set { color: #e08e45; border-color: #6d4a28; }
  .control.expand-control { cursor: pointer; color: var(--focus); }
  .control.confirm {
    color: #ffdfe0;
    border-color: var(--blocked);
    background: #47191d;
    animation: live-pulse 1.2s ease-in-out infinite;
  }

  .alarm-annunciator {
    position: relative;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 6px;
    min-width: 0;
    margin-top: 6px;
    padding: 5px 7px;
    overflow: hidden;
    border: 1px solid #ff7779;
    background:
      repeating-linear-gradient(125deg, #551c22 0 7px, #49171d 7px 14px);
    color: #fff1f1;
    box-shadow: inset 0 0 15px #ff353528, 0 0 10px #ff444421;
    font-family: var(--ui);
    font-size: 9px;
    font-weight: 900;
    letter-spacing: .09em;
    line-height: 1.2;
    text-transform: uppercase;
    white-space: nowrap;
  }
  /* The healthy mirror of the alarm: same weight, green — a starred card
     that is actually running. */
  .alarm-annunciator.live {
    border-color: #46d68f;
    background: repeating-linear-gradient(125deg, #12352a 0 7px, #0f2d22 7px 14px);
    color: #eafff5;
    box-shadow: inset 0 0 15px #2fd08928, 0 0 10px #2fd08921;
  }
  .alarm-annunciator.live .alarm-icon { background: #46d68f; color: #06180f; }
  .alarm-annunciator.live small { color: #9fe8c6; }
  .alarm-annunciator .alarm-icon {
    width: 15px;
    height: 15px;
    display: grid;
    place-items: center;
    background: var(--blocked);
    color: #19080a;
  }
  .alarm-annunciator .alarm-copy {
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .alarm-annunciator small {
    color: #ffb4b6;
    font-family: var(--telemetry);
    font-size: 7px;
    letter-spacing: .03em;
  }

  .operator-note {
    display: grid;
    grid-template-columns: 53px minmax(0, 1fr);
    gap: 7px;
    min-width: 0;
    margin-top: 6px;
    border: 1px solid #6d5b2d;
    background: linear-gradient(90deg, #3c321b, #252419 65%, #1c1c17);
  }
  .note-callout {
    display: grid;
    place-items: center;
    padding: 5px 4px;
    background: var(--note);
    color: #201a08;
    font-family: var(--ui);
    font-size: 7px;
    font-weight: 900;
    letter-spacing: .08em;
    line-height: 1.1;
    text-align: center;
    text-transform: uppercase;
  }
  .operator-note[data-note-edit] { cursor: text; }
  .operator-note[data-note-edit]:hover { border-color: #a08540; }
  .note-input {
    min-width: 0;
    align-self: center;
    margin: 3px 6px 3px 0;
    padding: 2px 5px;
    background: #10161f;
    border: 1px solid #60778c;
    border-radius: 2px;
    color: #ffe8a6;
    font: inherit;
    font-size: 10px;
    font-weight: 650;
    line-height: 1.25;
  }
  .note-input:focus { outline: none; border-color: var(--note); }
  .control.note-on { color: var(--note); border-color: #66582f; }
  .note-copy {
    min-width: 0;
    display: -webkit-box;
    align-self: center;
    overflow: hidden;
    padding: 5px 6px 5px 0;
    color: #ffe8a6;
    font-size: 10px;
    font-weight: 650;
    line-height: 1.25;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }

  .task-readout {
    display: grid;
    grid-template-columns: 14px minmax(0, 1fr) auto;
    align-items: start;
    gap: 6px;
    min-width: 0;
    margin-top: 6px;
    padding: 5px 6px;
    border: 1px solid #26384a;
    background: #0c151f;
  }
  .state-lamp {
    width: 9px;
    height: 9px;
    margin-top: 2px;
    border: 2px solid var(--state);
    background: transparent;
    box-shadow: 0 0 8px color-mix(in srgb, var(--state) 45%, transparent);
  }
  .state-lamp.working {
    border-color: var(--working);
    background: var(--working);
    animation: live-pulse 1.6s ease-in-out infinite;
  }
  .state-lamp.blocked { border-color: var(--blocked); background: var(--blocked); }
  .state-lamp.done { border-color: var(--done); background: var(--done); }
  .state-lamp.idle { border-radius: 50%; }
  .state-lamp.unknown { border-style: dashed; }
  @keyframes live-pulse { 50% { opacity: .38; } }
  .task-copy {
    display: -webkit-box;
    min-width: 0;
    overflow: hidden;
    color: #bfcbd7;
    font-size: 10px;
    line-height: 1.32;
    overflow-wrap: anywhere;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
  }
  .hide-control {
    width: 16px;
    height: 16px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    font-size: 11px;
    line-height: 1;
    opacity: 0;
  }
  .task-readout:hover .hide-control { opacity: .8; }
  .hide-control:hover { color: var(--ink); }

  .system-strip {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 7px;
    min-width: 0;
    margin-top: 5px;
    padding: 5px 7px;
    border: 1px solid #275f5a;
    background: #0e2927;
    color: #8ce8ce;
    font-family: var(--telemetry);
    font-size: 8px;
    letter-spacing: .025em;
    line-height: 1.25;
  }
  .system-strip.retire { border-color: #5c4c7e; background: #201a33; color: #cdbdff; }
  .system-strip.retire.error { border-color: #7b3c43; background: #31181c; color: #ff9da0; }
  .system-strip.lavish { border-color: #86407c; background: #2b1230; color: #f2a7e3; cursor: pointer; }
  .system-strip.lavish:hover { border-color: #d668c4; color: #ffd1f4; }
  .system-strip.due { border-color: #6d4a28; background: #2b1c0e; color: #ffc99a; }
  .system-strip span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .telemetry {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 5px;
    min-width: 0;
    margin-top: 6px;
    padding-top: 5px;
    border-top: 1px solid #253342;
  }
  .datum { min-width: 0; overflow: hidden; }
  .datum b {
    display: block;
    color: #506579;
    font-family: var(--ui);
    font-size: 6.5px;
    font-weight: 900;
    letter-spacing: .11em;
    line-height: 1;
    text-transform: uppercase;
  }
  .datum span {
    display: block;
    margin-top: 3px;
    overflow: hidden;
    color: var(--ink-mid);
    font-family: var(--telemetry);
    font-size: 7.5px;
    line-height: 1.1;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* The last column is flush with the card edge — its value must be too,
     otherwise the number hangs to the left of its own label. */
  .datum.age { text-align: right; }
  .datum.vector span { color: color-mix(in srgb, var(--dir-color) 68%, #fff); }
  .datum.age span.hot { color: var(--done); }
  .datum.age span.vhot { color: var(--blocked); }

  /* Compact Idle flight strips. */
  /* Compact idle strips: thin content-first rows. The direction color moves to
     a left rail, and the action buttons only appear on hover — 40+ resting rows
     must read as a list of names, not as a wall of controls. */
  .flight-card.compact { min-height: 26px; }
  .flight-card.compact::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: var(--dir-color);
  }
  .compact-grid {
    min-height: 26px;
    display: grid;
    grid-template-columns: 16px 26px minmax(0, 1fr) auto auto;
    align-items: center;
    gap: 5px;
    min-width: 0;
    padding: 2px 6px 2px 6px;
  }
  .expand-mini {
    width: 18px;
    height: 20px;
    display: grid;
    place-items: center;
    padding: 0;
    border: 0;
    background: transparent;
    color: var(--focus);
    cursor: pointer;
    font-family: var(--telemetry);
    font-size: 11px;
  }
  .compact-number {
    color: var(--ink-dim);
    font-family: var(--telemetry);
    font-size: 8px;
    font-weight: 700;
  }
  .compact-main { min-width: 0; }
  .compact-label {
    display: block;
    overflow: hidden;
    color: #cbd6df;
    font-family: var(--ui);
    font-size: 11px;
    font-weight: 850;
    line-height: 1.05;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* The base line is always there, empty or not: with it, every name in the
     column sits on the same baseline instead of riding 4px high on the rows
     that happen to carry a repo. It costs no height — the row keeps its 26px. */
  .compact-repo {
    display: block;
    min-height: 8px;
    margin-top: 1px;
    overflow: hidden;
    color: #536779;
    font-family: var(--telemetry);
    font-size: 6.5px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* Worktree affiliation reads differently from window affiliation on full
     and compact cards alike (declared after .compact-repo so it wins there). */
  .affil-tree { color: #6f9d8a; font-style: italic; }
  /* Signals and hover controls share one right-hand bay. Only one of them is
     shown at a time, so arriving with the pointer costs a few pixels of
     reflow — never a name covered mid-letter by a floating panel. */
  .compact-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    min-width: 0;
  }
  .compact-signals { display: flex; align-items: center; gap: 3px; }
  /* Flag, star and priority keep fixed slots at the right of the group, so the
     priority chip forms a column you can run your eye down; the rare signals
     (lavish, retire) grow to the left of them. */
  .signal.slot-empty { visibility: hidden; }
  .signal.noagent { color: var(--unknown); }
  .signal {
    min-width: 18px;
    height: 17px;
    display: inline-grid;
    place-items: center;
    padding: 0 3px;
    border: 1px solid #334557;
    color: var(--ink-dim);
    font-family: var(--telemetry);
    font-size: 7px;
    font-weight: 700;
  }
  .signal.note { color: var(--note); border-color: #66582f; }
  .signal.star { color: var(--note); }
  .signal.kind { color: #79d9ef; }
  .signal.date { color: #e08e45; border-color: #6d4a28; }
  .signal.retiring { color: var(--violet); border-color: #5b4c78; }
  .signal.lavish { color: #f2a7e3; border-color: #86407c; cursor: pointer; }
  .signal.lavish:hover { color: #ffd1f4; border-color: #d668c4; }
  /* Fixed width, not "as wide as the text": a row reading "24 min" must not
     shove its own signal chips out of the column the other rows keep. */
  .compact-age {
    width: 34px;
    min-width: 34px;
    overflow: hidden;
    color: #687b8d;
    font-family: var(--telemetry);
    font-size: 7px;
    text-align: right;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .compact-actions { display: none; align-items: center; gap: 2px; }
  .flight-card.compact:hover .compact-signals,
  .flight-card.compact:focus-within .compact-signals { display: none; }
  .flight-card.compact:hover .compact-actions,
  .flight-card.compact:focus-within .compact-actions { display: flex; }
  .compact-actions .control { width: 18px; min-width: 18px; height: 18px; padding: 0; font-size: 7px; }
  .compact-actions .control.confirm { width: auto; padding: 0 3px; }

  /* Controls with no value set are shadows until the pointer arrives. */
  .control.unset { opacity: .28; }
  .flight-card:hover .control.unset,
  .person-row:hover .control.unset,
  .misc-row:hover .control.unset { opacity: 1; }

  /* Team roster and unrecognized-window manifest. */
  .list-shell {
    container-type: inline-size;
    min-width: 0;
    border: 1px solid #263647;
    background: #0b121a;
    box-shadow: 0 10px 35px #0006;
  }
  .list-masthead {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: end;
    gap: 12px;
    padding: 11px 13px;
    border-bottom: 1px solid #33465a;
    background: linear-gradient(105deg, #1d2c3d, #101923 70%);
  }
  .list-masthead h2 {
    margin: 0;
    font-family: var(--ui);
    font-size: 16px;
    font-weight: 900;
    letter-spacing: .09em;
    line-height: 1;
    text-transform: uppercase;
  }
  .list-masthead p {
    margin: 5px 0 0;
    color: var(--ink-dim);
    font-size: 10px;
    line-height: 1.35;
  }
  .mast-metric {
    color: var(--focus);
    font-family: var(--telemetry);
    font-size: 10px;
    text-align: right;
    white-space: nowrap;
  }
  .roster { padding: 6px; }
  .person-row {
    --state: var(--unknown);
    position: relative;
    margin-bottom: 5px;
    overflow: hidden;
    border: 1px solid #2a3a4b;
    background: linear-gradient(90deg, color-mix(in srgb, var(--state) 7%, #111a24), #101822 64%);
    cursor: pointer;
  }
  .person-row.focused { border-color: var(--focus); box-shadow: inset 0 0 0 1px #78ddff66; }
  /* The name column is a fixed width, not a share of the row: every row is its
     own grid, so a share would make the state line start at a different place
     on every person. Fixed width = one straight column down the roster. */
  .person-top {
    min-height: 52px;
    display: grid;
    grid-template-columns: 22px 35px 170px minmax(0, 1fr) auto;
    align-items: center;
    gap: 8px;
    min-width: 0;
    padding: 7px 8px;
  }
  .person-expand {
    width: 22px;
    height: 30px;
    border: 0;
    background: transparent;
    color: var(--focus);
    cursor: pointer;
    font-family: var(--telemetry);
    font-size: 11px;
  }
  .person-status {
    width: 34px;
    height: 34px;
    display: grid;
    place-items: center;
    border: 1px solid color-mix(in srgb, var(--state) 65%, #334456);
    background: color-mix(in srgb, var(--state) 12%, #0b121a);
    color: var(--state);
    font-family: var(--ui);
    font-size: 14px;
    font-weight: 900;
  }
  .person-name { min-width: 0; }
  .person-name strong {
    display: block;
    overflow: hidden;
    font-family: var(--ui);
    font-size: 14px;
    font-weight: 900;
    letter-spacing: .025em;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .person-name small {
    display: block;
    margin-top: 3px;
    color: #607488;
    font-family: var(--telemetry);
    font-size: 7px;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .person-info {
    min-width: 0;
    overflow: hidden;
    color: var(--ink-mid);
    font-size: 10px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .person-right {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
    white-space: nowrap;
  }
  /* The two round controls keep their slot even on a person with no herdr
     window, so the counters end on the same line for everybody. */
  .person-controls {
    display: flex;
    flex: none;
    justify-content: flex-end;
    gap: 5px;
    min-width: 51px;
  }
  .roster-counter {
    min-height: 25px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    border: 1px solid #3a4b5d;
    background: #0a121b;
    color: var(--ink-dim);
    font-family: var(--ui);
    font-size: 8px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  .roster-counter b { color: var(--ink); font-family: var(--telemetry); font-size: 10px; }
  .roster-counter.waiting { border-color: #85464a; background: #29181c; color: #ff9b9e; }
  .roster-counter.waiting b { color: #fff0f0; }
  .roster-counter.lavish { border-color: #86407c; background: #2b1230; color: #f2a7e3; cursor: pointer; }
  .roster-counter.lavish b { color: #ffe4f8; }
  .person-details {
    display: none;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 1px;
    padding: 1px;
    border-top: 1px solid #2d4052;
    background: #263747;
  }
  .person-row.open .person-details { display: grid; }
  .detail-bay {
    min-width: 0;
    padding: 8px 9px;
    background: #0d161f;
  }
  .detail-bay h3 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin: 0 0 6px;
    color: #6f8498;
    font-family: var(--ui);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .detail-bay h3 b { color: var(--ink-mid); font-family: var(--telemetry); }
  .detail-bay.action h3 { color: #ff9295; }
  .detail-bay.deadline h3 { color: #ffc46b; }
  .detail-list { margin: 0; padding: 0; list-style: none; }
  .detail-list li {
    position: relative;
    padding: 4px 0 4px 12px;
    border-top: 1px solid #1b2936;
    color: #a7b7c5;
    font-size: 9.5px;
    line-height: 1.35;
    overflow-wrap: anywhere;
  }
  .detail-list li:first-child { border-top: 0; }
  .detail-list li::before { content: ""; position: absolute; left: 1px; top: 9px; width: 4px; height: 4px; background: #62788c; }
  .detail-bay.action li { color: #ffc0c2; }
  .detail-bay.action li::before { background: var(--blocked); }
  .detail-bay.deadline li { color: #e6c891; }
  .detail-bay.deadline li::before { background: var(--done); }
  .empty-detail { color: #506275; font-size: 9px; font-style: italic; }

  .subsection-label {
    margin: 10px 2px 6px;
    color: #657a8e;
    font-family: var(--ui);
    font-size: 8px;
    font-weight: 900;
    letter-spacing: .14em;
    text-transform: uppercase;
  }
  .team-mini-stack { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
  .team-mini-stack .flight-card { margin: 0; }

  .manifest { padding: 6px; }
  .misc-row {
    --state: var(--unknown);
    --dir-color: #3b4d60;
    position: relative;
    display: grid;
    grid-template-columns: 43px minmax(120px, .8fr) minmax(160px, 1.5fr) auto;
    align-items: stretch;
    min-width: 0;
    margin-bottom: 5px;
    border: 1px solid #2a3b4c;
    background: #101923;
    cursor: pointer;
  }
  .misc-row.focused { border-color: var(--focus); }
  /* The number plate is the row's left rail: it runs the full height of the
     row, so on a stacked layout the rule under the name starts where the rail
     ends instead of leaving the corner beside it unruled. */
  .misc-state {
    grid-row: 1 / -1;
    display: grid;
    place-items: center;
    border-right: 1px solid color-mix(in srgb, var(--state) 55%, #263747);
    background: color-mix(in srgb, var(--state) 13%, #0b121a);
    color: var(--state);
    font-family: var(--telemetry);
    font-size: 10px;
    font-weight: 700;
  }
  .misc-identity, .misc-content, .misc-meta { min-width: 0; padding: 7px 9px; }
  .misc-identity { border-right: 1px solid #263747; }
  .misc-identity strong {
    display: block;
    overflow: hidden;
    font-family: var(--ui);
    font-size: 12px;
    font-weight: 900;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .misc-identity small {
    display: block;
    margin-top: 3px;
    overflow: hidden;
    color: var(--ink-dim);
    font-family: var(--telemetry);
    font-size: 7px;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .misc-content { align-self: center; }
  .misc-title, .misc-note {
    display: block;
    overflow: hidden;
    font-size: 9.5px;
    line-height: 1.3;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .misc-title { color: #afbfcc; }
  .misc-note { margin-top: 3px; color: var(--note); font-weight: 650; }
  .misc-meta {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 5px;
    border-left: 1px solid #263747;
  }
  .misc-age { color: #74879a; font-family: var(--telemetry); font-size: 8px; white-space: nowrap; }

  /* Column-width degradation ladder: 500 -> 320 -> 260 -> 220px. */
  @container (min-width: 500px) {
    .card-body { padding: 9px; }
    .task-copy, .note-copy { font-size: 11px; }
    .session-label { font-size: 14px; }
    .task-copy { -webkit-line-clamp: 3; }
    .note-copy { -webkit-line-clamp: 3; }
  }

  @container (max-width: 320px) {
    .column-head { grid-template-columns: 29px minmax(0, 1fr) auto; gap: 6px; padding-inline: 6px; }
    .state-glyph { width: 27px; height: 27px; }
    .card-head { grid-template-columns: minmax(0, 1fr); }
    .control-rack { justify-content: flex-start; padding-left: 36px; }
    .alarm-annunciator small { display: none; }
  }

  @container (max-width: 260px) {
    .card-body { padding: 6px; }
    .operator-note { grid-template-columns: 45px minmax(0, 1fr); }
    .note-callout { font-size: 6px; }
    .task-copy, .note-copy { -webkit-line-clamp: 2; }
    .control { min-width: 21px; height: 21px; padding-inline: 3px; font-size: 7px; }
    .control-rack { padding-left: 0; }
    .alarm-annunciator { font-size: 8px; letter-spacing: .06em; }
    /* A narrow column tightens the strip, it does not empty it: the flag, the
       star, the priority and the age stay — only the reserved empty slots are
       given up, so the signals pack tight and the name takes the ellipsis. */
    .compact-grid { grid-template-columns: 16px 22px minmax(0, 1fr) auto auto; gap: 3px; }
    .signal { min-width: 15px; height: 15px; padding: 0 2px; }
    .signal.slot-empty { display: none; }
    .compact-signals { gap: 2px; }
    .compact-age { width: 28px; min-width: 28px; font-size: 6.5px; }
    .expand-mini { width: 16px; }
  }

  @container (max-width: 230px) {
    /* 54px covers a two-line title, so one- and two-line heads stay level. */
    .column-head { min-height: 54px; }
    .identity { grid-template-columns: 27px minmax(0, 1fr); gap: 5px; }
    .tail-number { width: 27px; min-height: 25px; }
    .session-label { font-size: 12px; }
    .operator-note { grid-template-columns: 39px minmax(0, 1fr); }
    .note-copy { font-size: 9px; }
    .task-copy { font-size: 9px; -webkit-line-clamp: 1; }
    .datum span { font-size: 7px; }
  }

  @container (max-width: 700px) {
    .person-top { grid-template-columns: 22px 34px minmax(0, 1fr) auto; }
    .person-info { grid-column: 3 / -1; grid-row: 2; padding-bottom: 2px; }
    .person-right { grid-column: 4; grid-row: 1; }
    .person-details { grid-template-columns: 1fr; }
    .team-mini-stack { grid-template-columns: 1fr; }
    /* The rows are spelled out so the number plate can span them all. */
    .misc-row { grid-template-columns: 39px minmax(0, 1fr) auto; grid-template-rows: auto auto; }
    .misc-content { grid-column: 2 / -1; border-top: 1px solid #263747; }
    .misc-meta { grid-column: 3; grid-row: 1; }
    /* One seam between the name and the meta bay, not two touching borders. */
    .misc-identity { border-right: 0; }
  }

  /* Below this the counters and controls no longer fit beside the name: they
     take a line of their own instead of being pushed off the window edge. */
  @container (max-width: 560px) {
    .person-top { grid-template-columns: 20px 31px minmax(0, 1fr); gap: 6px; padding-inline: 6px; }
    .person-status { width: 30px; height: 30px; }
    .person-info { grid-column: 1 / -1; grid-row: 2; padding-bottom: 0; }
    .person-right { grid-column: 1 / -1; grid-row: 3; justify-content: flex-start; flex-wrap: wrap; }
    .person-controls { justify-content: flex-start; min-width: 0; }
  }

  /* One-row deck only while brand + tabs + full readout + every chip fit
     side by side (measured need: ~1445px). Below that the deck stacks, so
     the readout keeps its whole line and the chips get a row of their own. */
  @media (max-width: 1460px) {
    .command-deck {
      grid-template-columns: auto minmax(0, 1fr);
      grid-template-areas:
        "brand readout"
        "views views"
        "filters filters";
    }
    .command-deck.no-filters {
      grid-template-areas:
        "brand readout"
        "views views";
    }
    #views { width: fit-content; max-width: 100%; }
    .view-tab { flex: 1; justify-content: center; }
    #filters { justify-content: flex-start; }
  }
  @media (max-width: 650px) {
    .command-deck {
      grid-template-columns: minmax(0, 1fr);
      grid-template-areas: "brand" "views" "readout" "filters";
      gap: 7px;
    }
    .command-deck.no-filters { grid-template-areas: "brand" "views" "readout"; }
    .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .brand small { margin: 0; }
    #views { width: 100%; }
    .view-tab { min-width: 0; flex: 1; justify-content: center; }
    #readout { white-space: normal; }
    #board.list { padding-inline: 6px; }
    .list-masthead { grid-template-columns: minmax(0, 1fr); }
    .mast-metric { text-align: left; }
  }
  @media (max-width: 340px) {
    .command-deck { padding: 7px 6px; }
    .brand strong { font-size: 16px; }
    .brand small { display: none; }
    .view-tab { padding-inline: 4px; font-size: 9px; }
    .view-tab .count { min-width: 19px; }
    .filter-key { font-size: 8px; padding-inline: 5px; }
    .person-top { gap: 5px; padding-inline: 5px; }
    .roster-counter { padding-inline: 5px; }
    .misc-row { grid-template-columns: 34px minmax(0, 1fr); grid-template-rows: auto auto auto; }
    .misc-meta { grid-column: 2; grid-row: 2; justify-content: flex-start; border-top: 1px solid #263747; border-left: 0; }
    .misc-content { grid-column: 2; grid-row: 3; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    .state-lamp.working { animation: none; }
    .control.confirm { animation: none; }
  }
</style>
</head>
<body>
<header class="command-deck">
  <div class="brand"><strong>Sheepdog</strong><small>fleet control // local</small></div>
  <nav id="views" aria-label="Board views"></nav>
  <div id="readout-zone">
    <div id="readout" aria-live="polite">AWAITING TELEMETRY…</div>
    <span id="error" role="alert"></span>
  </div>
  <nav id="filters" aria-label="Direction filters"></nav>
</header>
<main id="board" class="kanban"></main>

<script>
// Direction colors: a fixed palette assigned by a stable hash of the
// direction name, so any set of directions gets consistent colors
// without hardcoding categories into the source.
const DIR_PALETTE = ['#4c8fe0', '#8f6fe8', '#d08770', '#6c7686', '#56b3a5', '#d979b8', '#a3c76d'];
function dirColor(direction) {
  if (!direction) return null;
  let hash = 5381;
  for (const ch of String(direction)) hash = ((hash * 33) ^ ch.codePointAt(0)) >>> 0;
  return DIR_PALETTE[hash % DIR_PALETTE.length];
}

const STATE = {
  blocked: { color: 'var(--blocked)', glyph: '!', code: 'ACTION' },
  done: { color: 'var(--done)', glyph: '✓', code: 'REVIEW' },
  working: { color: 'var(--working)', glyph: '▶', code: 'LIVE' },
  idle: { color: 'var(--idle)', glyph: 'Ⅱ', code: 'STANDBY' },
  // "unknown" = the window is there but no agent is attached (typical right
  // after a herdr restart): an inactive card waiting to be brought back.
  unknown: { color: 'var(--unknown)', glyph: '○', code: 'NO AGENT' }
};
// Mine columns are roles ("what do I do with this"), not herdr states.
// The herdr state stays on every card as its lamp.
const COLDEF = {
  decisions: { color: '#f2a7e3', glyph: '◆', code: 'ON YOU' },
  focus:     { color: 'var(--focus)', glyph: '◎', code: 'DEEP WORK' },
  running:   { color: 'var(--working)', glyph: '▶', code: 'LIVE' },
  tools:     { color: '#f5c744', glyph: '✚', code: 'MAINT' },
  parked:    { color: 'var(--idle)', glyph: 'Ⅱ', code: 'STANDBY' },
};
const PRIO_NEXT = { P1: 'P2', P2: 'P3', P3: 'P1', '': 'P1' };
const PRIO_RANK = { P1: 0, P2: 1, P3: 2 };
const KIND_NEXT = { '': 'temp', temp: 'ongoing', ongoing: 'cron', cron: '' };
const ROLE_NEXT = { '': 'run', run: 'tool', tool: 'parked', parked: '' };
const ROLE_GLYPH = { run: '▶', tool: '✚', parked: 'Ⅱ' };
// Glyphs must exist in the monospace stack, otherwise the browser substitutes
// a colour emoji at the wrong size (⏱ came out as a blue smudge).
const KIND_LABEL = { temp: '⧗', ongoing: '∞', cron: '↻' };
const VIEWS = ['mine', 'team', 'other'];
const VIEW_LABELS = { mine: 'Mine', team: 'Team', other: 'Other' };
const PULSE_MS = 15 * 60 * 1000;

let data = null;
let NOW = Date.now();
const query = new URLSearchParams(location.search);
let filter = localStorage.getItem('board-filter') || '';
let view = query.get('view') || localStorage.getItem('board-view') || 'mine';
if (!VIEWS.includes(view)) view = 'mine';
// Deep focus: only the ◎-picked cards, everything else silenced. The pick
// itself lives in projects.json (survives reloads); the mode is per-browser.
// An explicit ?deep=1/0 wins once and is then consumed from the address bar,
// so later reloads answer to localStorage (and the toggle) alone.
const deepParam = query.get('deep');
let deepFocus = deepParam !== null ? deepParam === '1' : localStorage.getItem('board-deep') === '1';
if (deepParam !== null) {
  localStorage.setItem('board-deep', deepFocus ? '1' : '');
  query.delete('deep');
  history.replaceState(null, '', location.pathname + ([...query].length ? '?' + query.toString() : ''));
}
let lastFocusedTab = null;
let pageVersion = null;
let pendingOff = null;
let pendingOffTimer = null;
// cwd whose note is being typed right now; repaints hold off so the input
// (and the text in it) survives the 3-second refresh cycle.
let noteEditing = null;
const expanded = new Set();

function esc(value) {
  return String(value ?? '').replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
}

// The view comes from the FOLDER, never from the agent status: after a herdr
// restart every window is agentless ("unknown") for a while, and exiling the
// whole fleet to Other left Mine empty — the opposite of what a restart needs
// (operator's rule, 2026-08-20). Other holds only explicitly marked windows.
function viewOf(card) {
  return card.view ?? 'mine';
}

function age(sinceIso) {
  if (!sinceIso) return null;
  const minutes = Math.round((NOW - new Date(sinceIso).getTime()) / 60000);
  if (minutes < 5) return null;
  if (minutes < 60) return `${minutes} min`;
  if (minutes < 48 * 60) return `${Math.round(minutes / 60)} h`;
  return `${Math.round(minutes / 60 / 24)} d`;
}

function hasPulse(card) {
  return Boolean(card.star && card.lastWorkingAt && (NOW - new Date(card.lastWorkingAt).getTime()) < PULSE_MS);
}

// "Running" means running RIGHT NOW: herdr says working, or the Mac twin
// runs. A recent pulse is NOT running — a card idle for 7 minutes wearing a
// green RUNNING banner was the operator's second status bug of 2026-08-20.
// The pulse only delays the red alarm on a star (see isAlarm).
function isLive(card) {
  return card.status === 'working' || Boolean(card.remote);
}

// Column order (operator's rules, 2026-08-20): everything RUNNING right now
// floats to the top — the live starred card above all, then other live
// cards; among the stalled, alarming stars first, quiet stars next, the
// rest last. This is how a starred card tops Standby without leaving it.
function activityRank(card) {
  if (isLive(card)) return card.star ? 0 : 1;
  if (waitsExternal(card)) return card.star ? 2 : 3;
  if (card.star) return isAlarm(card) ? 4 : 5;
  return 6;
}

function localDate(ms) {
  const d = new Date(ms);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function dateDue(card) {
  return Boolean(card.checkDate && card.checkDate <= localDate(NOW));
}
function shortDate(iso) {
  return iso ? `${iso.slice(8, 10)}.${iso.slice(5, 7)}` : '';
}

// Decisions hold only LIVE sessions that are asking the operator something:
// blocked, holding a review page, an arrived check-back date, or starred and
// waiting for his word. A window whose session is not even loaded asks
// nothing (operator, 2026-08-21) — no page, date or star changes that: it
// parks in Standby with all its signals still visible on the card.
function roleColumnOf(card) {
  if (card.agent && ((card.lavish ?? []).length || card.status === 'blocked' || dateDue(card))) return 'decisions';
  if (card.focus) return 'focus';
  if (card.role === 'tool') return 'tools';
  if (card.role === 'parked') return 'parked';
  // Running holds work in motion: live sessions, cron work (idle between
  // wakeups is normal), and sessions whose work an external system is
  // running right now — CI, a queue, the Mac (operator, 2026-08-21: "waits
  // on CI" is neither his decision nor a parked project). A starred session
  // waiting for the operator's word goes to Decisions. A starred window
  // with no agent parks in Standby at the top with its MUST RUN alarm;
  // unstarred stalled cards just park.
  if (isLive(card) || card.kind === 'cron' || waitsExternal(card)) return 'running';
  if (card.star && card.agent) return 'decisions';
  return 'parked';
}

// Which columns show a card as a thin row: Tools, Parked and Running while
// the process rests. Anything alive right now — working, remote, pulsing,
// finished-unseen (done) or alarming — keeps the full card, so its herdr
// lamp stays visible whatever column the role put it in.
function thinCard(card, columnKey) {
  if (columnKey !== 'tools' && columnKey !== 'parked' && columnKey !== 'running') return false;
  return !(card.status === 'working' || card.status === 'done' || card.remote || hasPulse(card) || waitsExternal(card) || isAlarm(card));
}

// Waiting on an external system (CI, a queue, another machine — the recap
// model's verdict) is work in flight, not a parked project and not an alarm
// (operator, 2026-08-21): the external system is doing the running.
function waitsExternal(card) {
  return Boolean(card.agent && card.recapWaits === 'system' && !isLive(card));
}

function isAlarm(card) {
  // A star alarms only when nothing moves at all: the session is not
  // working, no Mac twin, no external system running for it, and even the
  // pulse has gone stale.
  return Boolean(card.star && !isLive(card) && !waitsExternal(card) && !hasPulse(card));
}

// Two names say the same thing when one is contained in the other — the
// second line of a row must add something, not echo the first.
function sameName(a, b) {
  const normalize = value => String(value ?? '').toLowerCase().replace(/[^\p{L}\p{N}]/gu, '');
  const x = normalize(a);
  const y = normalize(b);
  if (!x || !y) return false;
  return x === y || (Math.min(x.length, y.length) >= 4 && (x.includes(y) || y.includes(x)));
}

// Where does this card belong? ALWAYS answered on the card (operator's rule,
// 2026-08-20: a bare tab name like "board-v2" says nothing) — in two distinct
// shapes: a tab names its main window (WINDOW /), a worktree names its parent
// repo (TREE /). The only thing never printed is the card's own name again.
function affiliation(card) {
  const out = [];
  const win = card.wsLabel && !sameName(card.wsLabel, card.label) ? card.wsLabel : '';
  if (win) out.push({ kind: 'window', text: win });
  if (card.repo && !sameName(card.repo, card.label) && !(win && sameName(card.repo, win))) {
    // "tree" = a linked worktree of the repo; a plain checkout in the repo
    // itself gets the neutral REPO / mark instead.
    out.push({ kind: card.tree ? 'tree' : 'repo', text: card.repo });
  }
  return out;
}

// The small line under a card in the Other list: the affiliation if there is
// one, else the herdr tab id.
function subText(card) {
  const aff = affiliation(card);
  return aff.length ? aff.map(a => a.text).join(' · ') : (card.tabId || '');
}

function stateStyle(status) {
  return `--state:${STATE[status]?.color || STATE.unknown.color}`;
}

// Power button: first click arms it ("SURE?"), second click retires the tab.
function powerControl(card) {
  const tabId = card?.tabId || '';
  const offPending = pendingOff === tabId && tabId;
  return `<button type="button" class="control power-control ${offPending ? 'confirm' : ''}" data-pane="${esc(card?.id || '')}" data-tab="${esc(tabId)}" data-ws="${esc(tabId ? tabId.split(':')[0] : '')}" title="Save memory and close the window">${offPending ? 'SURE?' : '⏻'}</button>`;
}

// Focus glyph: carries no handler of its own — the click bubbles to the
// enclosing [data-tab] element, which jumps to the herdr tab.
function focusControl() {
  return `<button type="button" class="control focus-control" title="Jump to this herdr tab">⊕</button>`;
}

function starControl(card, extraClass) {
  return `<button type="button" class="control star-control ${card.star ? 'star-on' : 'unset'} ${extraClass || ''}" data-cwd="${esc(card.cwd)}" data-star="${card.star ? '1' : ''}" title="Star: must not stop">${card.star ? '★' : '☆'}</button>`;
}

function prioControl(card, extraClass) {
  return `<button type="button" class="control prio-control ${String(card.prio || '').toLowerCase()} ${card.prio ? '' : 'unset'} ${extraClass || ''}" data-cwd="${esc(card.cwd)}" data-prio="${esc(card.prio || '')}" title="Click to change priority">${esc(card.prio || '·')}</button>`;
}

function kindControl(card) {
  return `<button type="button" class="control kind-control ${card.kind ? `kind-${esc(card.kind)}` : 'unset'}" data-cwd="${esc(card.cwd)}" data-kind="${esc(card.kind || '')}" title="Kind: temporary (⧗), ongoing (∞) or cron-driven (↻)">${KIND_LABEL[card.kind] || '·'}</button>`;
}

function roleControl(card) {
  return `<button type="button" class="control role-control ${card.role ? `role-${esc(card.role)}` : 'unset'}" data-cwd="${esc(card.cwd)}" data-role="${esc(card.role || '')}" title="Role: runs (▶), tool (✚), parked (Ⅱ) or auto (·)">${ROLE_GLYPH[card.role] || '·'}</button>`;
}

function focusPickControl(card) {
  return `<button type="button" class="control focuspick-control ${card.focus ? 'focuspick-on' : 'unset'}" data-cwd="${esc(card.cwd)}" data-focus="${card.focus ? '1' : ''}" title="Deep-focus pick: this card stays visible in focus mode">◎</button>`;
}

function dateControl(card) {
  return `<button type="button" class="control date-control ${card.checkDate ? 'date-set' : 'unset'}" data-cwd="${esc(card.cwd)}" data-date="${esc(card.checkDate || '')}" title="Check-back date: +3 d → +1 week → +2 weeks → off. On arrival the card surfaces in Decisions">${card.checkDate ? esc(shortDate(card.checkDate)) : '⧖'}</button>`;
}

// The note is the operator's own line and nothing else: set and cleared right
// here, never inherited, never written by automation (his rule, 2026-08-20).
function noteControl(card) {
  return `<button type="button" class="control note-control ${card.note ? 'note-on' : 'unset'}" data-cwd="${esc(card.cwd)}" data-id="${esc(card.id)}" title="${card.note ? 'Edit the note' : 'Add a note'}">⚑</button>`;
}

function noteStrip(card) {
  if (noteEditing === card.cwd) {
    return `<div class="operator-note editing"><span class="note-callout">Note</span><input class="note-input" data-cwd="${esc(card.cwd)}" maxlength="300" value="${esc(card.note || '')}" placeholder="Enter saves · empty clears · Esc cancels"></div>`;
  }
  if (!card.note) return '';
  return `<div class="operator-note" data-note-edit="${esc(card.cwd)}" data-id="${esc(card.id)}" title="Click to edit or clear"><span class="note-callout">Note</span><span class="note-copy">${esc(card.note)}</span></div>`;
}

// The whole card is a jump-to-tab button, so the full rack spends no slot on ⊕.
function controlRack(card, allowCollapse) {
  const power = powerControl(card);
  const collapse = allowCollapse
    ? `<button type="button" class="control expand-control" data-expand="${esc(card.id)}" title="Collapse to a thin row">▴</button>`
    : '';
  if (!card.cwd) return `<div class="control-rack">${collapse}${power}${focusControl()}</div>`;
  return `<div class="control-rack">${collapse}${focusPickControl(card)}${starControl(card)}${kindControl(card)}${roleControl(card)}${prioControl(card)}${dateControl(card)}${noteControl(card)}${power}</div>`;
}

function fullCard(card, columnKey) {
  const displayedAge = age(card.since);
  const ageClass = card.status === 'blocked' || card.status === 'done'
    ? (displayedAge && displayedAge.includes('d') && !displayedAge.includes('min') ? 'vhot' : 'hot')
    : '';
  // Deep focus silences every alarm — his explicit call.
  const alarm = !deepFocus && isAlarm(card);
  // The healthy mirror of the alarm: a starred card that IS running gets the
  // same weight of highlight, in green — never mutually true with the alarm.
  // Only a card running RIGHT NOW earns the green banner — a fresh pulse on
  // an idle card does not (operator, 2026-08-20).
  const liveStar = Boolean(card.star && !isAlarm(card) && isLive(card));
  const focused = Boolean(card.tabId && card.tabId === data.focusedTab);
  const retire = data.retire?.[card.tabId];
  const aff = affiliation(card);
  const pulseMinutes = card.lastWorkingAt ? Math.round((NOW - new Date(card.lastWorkingAt).getTime()) / 60000) : null;
  const remoteLine = card.remote
    ? `<div class="system-strip"><b>REMOTE</b><span>agent active on second machine</span></div>`
    : (card.status !== 'working' && hasPulse(card)
      ? `<div class="system-strip"><b>PULSE</b><span>active ${pulseMinutes < 1 ? 'just now' : `${pulseMinutes} min ago`}</span></div>`
      : '');
  const retireLine = retire
    ? `<div class="system-strip retire ${retire.error ? 'error' : ''}"><b>⏻ RETIRE</b><span title="${esc(retire.error || retire.phase)}">${esc(retire.error || retire.phase)}</span></div>`
    : '';
  const dueLine = dateDue(card)
    ? `<div class="system-strip due"><b>⧖ CHECK DUE</b><span>check-back date ${esc(shortDate(card.checkDate))} has arrived</span></div>`
    : '';
  const lavishLines = (card.lavish ?? []).map(a =>
    `<div class="system-strip lavish" data-lavish-url="${esc(a.url)}" title="Open the review page in the browser">
      <b>◈ LAVISH</b><span>${esc(a.name)}${a.pending ? ' · reply queued' : ' · awaiting your review'}</span></div>`).join('');
  // One task line: the herdr state lamp plus the recap of what the session
  // is actually doing. The session's self-written title is not shown — "I
  // don't need what the session called its task, I need the current recap"
  // (operator, 2026-08-20).
  const taskLine = card.recap
    ? `<div class="task-readout"><span class="state-lamp ${esc(card.status)}"></span><span class="task-copy" title="${esc(card.recap)}">${esc(card.recap)}</span></div>`
    : '';

  return `<article class="flight-card ${card.status === 'unknown' ? 'unknown-card' : ''} ${alarm ? 'alarm-card' : ''} ${liveStar ? 'star-live' : ''} ${focused ? 'focused' : ''}" data-tab="${esc(card.tabId || '')}" title="Click to jump to this herdr tab" style="${stateStyle(card.status)};--dir-color:${dirColor(card.dir) || '#3b4d60'}">
    ${focused ? `<div class="focus-banner"><span>You are here</span><span>focused herdr tab</span></div>` : ''}
    <div class="card-body">
      <div class="card-head">
        <div class="identity">
          <span class="tail-number">#${card.number ?? '·'}</span>
          <span class="label-stack">
            <span class="session-label" title="${esc(card.cwd || card.label)}">${esc(card.label)}</span>
            ${aff.map(a => `<span class="affil affil-${a.kind}" title="${esc(a.text)}">${esc(a.text)}</span>`).join('')}
          </span>
        </div>
        ${controlRack(card, expanded.has(card.id))}
      </div>
      ${alarm ? `<div class="alarm-annunciator" title="Must not stop, but stuck"><span class="alarm-icon">!</span><span class="alarm-copy">Must run · signal idle</span><small>ATTN</small></div>` : ''}
      ${liveStar ? `<div class="alarm-annunciator live" title="Starred and running"><span class="alarm-icon">★</span><span class="alarm-copy">Star project · running</span><small>LIVE</small></div>` : ''}
      ${waitsExternal(card) ? `<div class="system-strip" title="An external system is doing the running"><b>⏳ EXTERNAL</b><span>waiting on an external system (CI, queue, machine)</span></div>` : ''}
      ${noteStrip(card)}
      ${taskLine}
      ${remoteLine}
      ${retireLine}
      ${dueLine}
      ${lavishLines}
      <div class="telemetry">
        <span class="datum vector"><b>Direction</b><span title="${esc(card.dir || 'unassigned')}">${esc(card.dir || 'unassigned')}</span></span>
        <span class="datum age"><b>Stuck</b><span class="${ageClass}">${esc(displayedAge || '—')}</span></span>
      </div>
    </div>
  </article>`;
}

function compactCard(card, options = {}) {
  const focused = Boolean(card.tabId && card.tabId === data.focusedTab);
  const retire = data.retire?.[card.tabId];
  const affs = affiliation(card);
  const canExpand = options.expand !== false;
  // Rare signals first, then three fixed slots: an unset flag, star or priority
  // still holds its place, so the priority chips line up down the column.
  // The lavish chip lives OUTSIDE the hover-hidden signals group: hovering the
  // row swaps signals for actions, and a chip that hides on approach can never
  // be clicked.
  const lavishChip = (card.lavish ?? []).length
    ? `<span class="signal lavish" data-lavish-url="${esc(card.lavish[0].url)}" title="Lavish review: ${esc(card.lavish.map(a => a.name).join(', '))}">◈</span>`
    : '';
  const signals = [
    card.status === 'unknown' ? `<span class="signal noagent" title="No agent in this window — bring the session back">○</span>` : '',
    retire ? `<span class="signal retiring" title="${esc(retire.error || retire.phase)}">⏻</span>` : '',
    card.checkDate ? `<span class="signal date" title="Check back on ${esc(card.checkDate)}">${esc(shortDate(card.checkDate))}</span>` : '',
    card.kind ? `<span class="signal kind" title="Kind: ${esc(card.kind)}">${KIND_LABEL[card.kind]}</span>` : '',
    card.note ? `<span class="signal note" title="${esc(card.note)}">⚑</span>` : '<span class="signal slot-empty"></span>',
    card.star ? `<span class="signal star" title="Must not stop">★</span>` : '<span class="signal slot-empty"></span>',
    card.prio ? `<span class="signal ${String(card.prio).toLowerCase()}">${esc(card.prio)}</span>` : '<span class="signal slot-empty"></span>'
  ].join('');
  // Role, ◎ and the check-back date only surface on the Mine kanban — a team
  // row offering them would store state no view ever shows.
  const mine = viewOf(card) === 'mine';
  const actions = (card.cwd
    ? (mine ? focusPickControl(card) : '') + starControl(card) + (mine ? roleControl(card) : '') + prioControl(card) + (mine ? dateControl(card) : '') + (mine ? noteControl(card) : '')
    : '') + powerControl(card) + focusControl();
  return `<article class="flight-card compact ${card.status === 'unknown' ? 'unknown-card' : ''} ${focused ? 'focused' : ''}" data-tab="${esc(card.tabId || '')}" style="${stateStyle(card.status)};--dir-color:${dirColor(card.dir) || '#3b4d60'}" title="${esc(card.recap || card.title || card.note || card.label)}&#10;Click to jump; arrow expands">
    ${focused ? `<div class="focus-banner"><span>You are here</span><span>focused herdr tab</span></div>` : ''}
    <div class="compact-grid">
      ${canExpand ? `<button type="button" class="expand-mini" data-expand="${esc(card.id)}" title="Expand idle card">▸</button>` : `<span class="state-lamp ${esc(card.status)}"></span>`}
      <span class="compact-number">#${card.number ?? '·'}</span>
      <span class="compact-main"><span class="compact-label">${esc(card.label)}</span><span class="compact-repo">${affs.map(a => `<span class="affil-${a.kind}">${esc(a.text)}</span>`).join(' ')}</span></span>
      <span class="compact-right">${lavishChip}<span class="compact-signals">${signals}</span><span class="compact-actions">${actions}</span></span>
      <span class="compact-age">${esc(age(card.since) || '')}</span>
    </div>
  </article>`;
}

function renderKanban(cards) {
  const board = document.getElementById('board');
  board.className = 'kanban';
  // Keep each column's scroll position across re-renders.
  const scrolls = {};
  board.querySelectorAll('.column-list').forEach(el => scrolls[el.dataset.column] = el.scrollTop);

  board.innerHTML = data.columns.map((column, index) => {
    const inColumn = cards
      .filter(card => roleColumnOf(card) === column.key)
      .sort((a, b) => column.key === 'parked'
        // Parked: live cards first, then dated check-backs, nearest date first.
        ? (activityRank(a) - activityRank(b) ||
           (a.checkDate ? 0 : 1) - (b.checkDate ? 0 : 1) ||
           (a.checkDate || '9').localeCompare(b.checkDate || '9') ||
           (PRIO_RANK[a.prio] ?? 9) - (PRIO_RANK[b.prio] ?? 9) ||
           a.number - b.number)
        : (activityRank(a) - activityRank(b) ||
           (PRIO_RANK[a.prio] ?? 9) - (PRIO_RANK[b.prio] ?? 9) ||
           (a.since || '9').localeCompare(b.since || '9') ||
           a.number - b.number));
    const def = COLDEF[column.key] || STATE.unknown;
    const cardsHtml = inColumn.map(card => {
      const compact = thinCard(card, column.key) && !expanded.has(card.id);
      return compact ? compactCard(card) : fullCard(card, column.key);
    }).join('');
    return `<section class="flight-column" style="--state:${def.color}">
      <header class="column-head">
        <span class="state-glyph">${def.glyph}</span>
        <span class="column-title"><strong title="${esc(column.title)}">${esc(column.title)}</strong><small>${String(index + 1).padStart(2, '0')} / ${def.code}</small></span>
        <span class="column-count">${String(inColumn.length).padStart(2, '0')}</span>
      </header>
      <div class="column-list" data-column="${esc(column.key)}">${cardsHtml}</div>
    </section>`;
  }).join('');

  board.querySelectorAll('.column-list').forEach(el => {
    if (scrolls[el.dataset.column]) el.scrollTop = scrolls[el.dataset.column];
  });
}

// Deep focus: a flat grid of only the picked cards, everything else gone.
function renderDeepFocus(cards) {
  const board = document.getElementById('board');
  board.className = 'list';
  const picked = cards.filter(card => card.focus);
  board.innerHTML = `<section class="list-shell">
    <header class="list-masthead">
      <span><h2>Deep focus</h2><p>Only the cards you picked with ◎. Everything else — star alarms included — stays silent until you leave.</p></span>
      <span class="mast-metric">${picked.length} PICKED</span>
    </header>
    ${picked.length
      ? `<div class="focus-grid">${picked.map(card => fullCard(card, 'focus')).join('')}</div>`
      : `<div class="focus-empty">Nothing picked yet — leave focus mode, click ◎ on the cards that matter, then come back.</div>`}
  </section>`;
}

// Team: one row per person — their herdr session plus tracker items.
function personRow(key, person, cards, used) {
  const normalize = value => String(value ?? '').toLowerCase();
  const card = cards.find(item => normalize(item.cwd).includes(`\\people\\${key}`) || normalize(item.label) === key);
  if (card) used.add(card.id);
  const status = card ? card.status : null;
  const lastWorking = card?.lastWorkingAt ? age(card.lastWorkingAt) : null;
  const info = card
    ? (status === 'working' ? 'session working'
      : status === 'blocked' ? 'session waiting on you'
      : lastWorking ? `session active ${lastWorking} ago` : 'session idle')
    : 'no window';
  const waiting = person?.waitingOnYou ?? [];
  const deadlines = person?.deadlines ?? [];
  const top = person?.top ?? [];
  const openKey = `p:${key}`;
  const isOpen = expanded.has(openKey);
  const focused = Boolean(card && card.tabId === data.focusedTab);
  const bay = (className, title, items, empty) => `<section class="detail-bay ${className}">
    <h3><span>${title}</span><b>${String(items.length).padStart(2, '0')}</b></h3>
    ${items.length ? `<ul class="detail-list">${items.map(item => `<li>${esc(item)}</li>`).join('')}</ul>` : `<span class="empty-detail">${empty}</span>`}
  </section>`;
  return `<article class="person-row ${isOpen ? 'open' : ''} ${focused ? 'focused' : ''}" data-tab="${esc(card?.tabId || '')}" style="${stateStyle(status || 'unknown')}">
    <div class="person-top">
      <button type="button" class="person-expand" data-expand="${esc(openKey)}" aria-expanded="${isOpen}" title="${isOpen ? 'Collapse' : 'Expand'} person details">${isOpen ? '▾' : '▸'}</button>
      <span class="person-status">${STATE[status]?.glyph || STATE.unknown.glyph}</span>
      <span class="person-name"><strong>${esc(person?.name || key)}</strong><small>${card ? `TAB ${esc(card.tabId)}` : 'NO HERDR TAB'}</small></span>
      <span class="person-info" title="${esc(info)}">${esc(info)}${person?.trackerDate ? ` · tracker ${esc(person.trackerDate)}` : ''}</span>
      <span class="person-right">
        ${waiting.length ? `<span class="roster-counter waiting"><span>waiting on you</span><b>${waiting.length}</b></span>` : ''}
        ${(card?.lavish ?? []).length ? `<span class="roster-counter lavish" data-lavish-url="${esc(card.lavish[0].url)}" title="Lavish review: ${esc(card.lavish.map(a => a.name).join(', '))}"><span>◈ lavish</span><b>${card.lavish.length}</b></span>` : ''}
        ${top.length ? `<span class="roster-counter"><span>tasks</span><b>${top.length}</b></span>` : ''}
        <span class="person-controls">${card ? powerControl(card) + focusControl() : ''}</span>
      </span>
    </div>
    <div class="person-details">
      ${bay('action', 'Waiting on you', waiting, 'No operator actions')}
      ${bay('deadline', 'Deadlines', deadlines, 'No recorded deadlines')}
      ${bay('', 'On their plate', top, 'Nothing on the tracker')}
    </div>
  </article>`;
}

function renderTeam(cards) {
  const board = document.getElementById('board');
  board.className = 'list';
  const people = data.team?.people ?? {};
  const used = new Set();
  const rows = Object.keys(people).map(key => personRow(key, people[key], cards, used));
  const rest = cards.filter(card => !used.has(card.id));
  const waitingTotal = Object.values(people).reduce((sum, person) => sum + (person.waitingOnYou?.length || 0), 0);
  board.innerHTML = `<section class="list-shell">
    <header class="list-masthead">
      <span><h2>Team flight roster</h2><p>Tracker actions, deadlines and attached herdr sessions. Expand a row for the full manifest.</p></span>
      <span class="mast-metric">${Object.keys(people).length} PEOPLE / ${waitingTotal} WAITING ON YOU</span>
    </header>
    <div class="roster">${rows.join('')}
      ${rest.length ? `<div class="subsection-label">Other team sessions / ${rest.length}</div><div class="team-mini-stack">${rest.map(card => compactCard(card, { expand: false })).join('')}</div>` : ''}
    </div>
  </section>`;
}

function renderOther(cards) {
  const board = document.getElementById('board');
  board.className = 'list';
  const rows = cards
    .sort((a, b) => (a.since || '9').localeCompare(b.since || '9'))
    .map(card => {
      const status = card.status || 'unknown';
      const focused = Boolean(card.tabId && card.tabId === data.focusedTab);
      const retire = data.retire?.[card.tabId];
      return `<article class="misc-row ${focused ? 'focused' : ''}" data-tab="${esc(card.tabId || '')}" title="Click to jump to this herdr tab" style="${stateStyle(status)};--dir-color:${dirColor(card.dir) || '#3b4d60'}">
        <span class="misc-state">#${card.number ?? '·'}</span>
        <span class="misc-identity"><strong title="${esc(card.label)}">${esc(card.label)}</strong><small>${esc(subText(card))}</small></span>
        <span class="misc-content">
          <span class="misc-title" title="${esc(card.recap || card.title || 'No reported task')}">${esc(card.recap || card.title || 'No reported task')}</span>
          ${card.note ? `<span class="misc-note" title="${esc(card.note)}">⚑ ${esc(card.note)}</span>` : ''}
          ${(card.lavish ?? []).map(a => `<span class="misc-note lavish-note" data-lavish-url="${esc(a.url)}" title="Open the review page">◈ ${esc(a.name)}</span>`).join('')}
          ${retire ? `<span class="misc-note" title="${esc(retire.error || retire.phase)}">⏻ ${esc(retire.error || retire.phase)}</span>` : ''}
        </span>
        <span class="misc-meta"><span class="misc-age">${age(card.since) ? `stuck ${esc(age(card.since))}` : ''}</span>${powerControl(card)}${focusControl()}</span>
      </article>`;
    }).join('');
  board.innerHTML = `<section class="list-shell">
    <header class="list-masthead">
      <span><h2>Other windows</h2><p>Marked as outside your flow. The ⏻ control saves memory and closes the window.</p></span>
      <span class="mast-metric">${cards.length} SET-ASIDE RECORDS</span>
    </header>
    <div class="manifest">${rows}</div>
  </section>`;
}

function renderHeader(allViewCards) {
  const counts = { mine: 0, team: 0, other: 0 };
  for (const card of data.cards) counts[viewOf(card)] = (counts[viewOf(card)] ?? 0) + 1;
  const picked = data.cards.filter(card => card.focus && viewOf(card) === 'mine').length;
  document.getElementById('views').innerHTML = VIEWS.map(key => `<button type="button" class="view-tab ${key === view ? 'on' : ''}" data-view="${key}" aria-pressed="${key === view}"><span>${VIEW_LABELS[key]}</span><span class="count">${counts[key] || 0}</span></button>`).join('')
    + `<button type="button" class="view-tab deep-toggle ${deepFocus ? 'on' : ''}" id="deepfocus" aria-pressed="${deepFocus}" title="Deep focus: show only ◎-picked cards, silence everything else"><span>◎ Focus</span><span class="count">${picked}</span></button>`;

  const filters = document.getElementById('filters');
  if (view === 'mine' && !deepFocus) {
    const directions = [...new Set(allViewCards.map(card => card.dir).filter(Boolean))];
    if (filter && !directions.includes(filter)) {
      filter = '';
      localStorage.setItem('board-filter', '');
    }
    filters.innerHTML = [`<button type="button" class="filter-key ${filter === '' ? 'on' : ''}" data-direction="" title="All directions"><span class="lamp" style="--dir:#7c91a4"></span><span class="filter-name">All</span></button>`]
      .concat(directions.map(direction => `<button type="button" class="filter-key ${filter === direction ? 'on' : ''}" data-direction="${esc(direction)}" title="${esc(direction)}"><span class="lamp" style="--dir:${dirColor(direction)}"></span><span class="filter-name">${esc(direction)}</span></button>`))
      .join('');
  } else {
    filters.innerHTML = '';
  }
  document.querySelector('.command-deck').classList.toggle('no-filters', !filters.children.length);

  updateReadout();
}

// The readout line updates on every poll even when the board itself is not
// redrawn — the UPDATED clock must tick without repainting the columns.
function updateReadout() {
  const timestamp = new Date(data.generatedAt).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const remote = data.remote?.tasks?.length ? ` / <strong>REMOTE ${esc(data.remote.tasks.join(', '))}</strong>` : '';
  const lavishTotal = data.lavish?.total ? ` / <strong class="lavish-total">◈ LAVISH ${data.lavish.total}</strong>` : '';
  const readout = document.getElementById('readout');
  readout.innerHTML = `SESSIONS ${data.cards.length} / WINDOWS ${data.windows} / UPDATED ${timestamp}${remote}${lavishTotal}`;
  // If the line still has to be cut on a very narrow deck, the full text stays
  // reachable as a tooltip instead of being lost.
  readout.title = readout.textContent;
}

function render() {
  if (!data) return;
  NOW = Date.now();

  const allViewCards = data.cards.filter(card => viewOf(card) === view);
  renderHeader(allViewCards);
  const visibleCards = view === 'mine' ? allViewCards.filter(card => !filter || card.dir === filter) : allViewCards;
  if (view === 'team') renderTeam(visibleCards);
  else if (view === 'other') renderOther(visibleCards);
  // Deep focus ignores the direction filter: the contract is "all picked
  // cards, nothing else", and the header badge counts the same set.
  else if (deepFocus) renderDeepFocus(allViewCards);
  else renderKanban(visibleCards);

  // Focus changed inside herdr — scroll to the highlighted card.
  // Vertically only: scrolling the board sideways would push the Blocked
  // column (the leftmost, the one that matters) out of the window.
  if (data.focusedTab && data.focusedTab !== lastFocusedTab) {
    lastFocusedTab = data.focusedTab;
    const el = document.querySelector('.flight-card.focused, .person-row.focused, .misc-row.focused');
    const pane = el && (el.closest('.column-list') || document.getElementById('board'));
    if (pane) {
      const card = el.getBoundingClientRect();
      const view = pane.getBoundingClientRect();
      const delta = card.top < view.top ? card.top - view.top
        : card.bottom > view.bottom ? Math.min(card.bottom - view.bottom, card.top - view.top)
        : 0;
      if (delta) pane.scrollBy({ top: delta, behavior: 'smooth' });
    }
  }
}

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.style.display = 'inline-block';
}

// seq drops stale responses, inflight keeps polls from overlapping.
let seq = 0;
let inflight = false;
// Repaint only when the picture actually changed: rebuilding identical HTML
// every 3 seconds reads as flicker (operator, 2026-08-20). Age timers still
// need an occasional pass, so an unchanged board redraws once a minute.
let lastRenderSig = '';
let lastRenderAt = 0;
async function refresh(force) {
  if (inflight && !force) return;
  inflight = true;
  const my = ++seq;
  try {
    const r = await fetch('/data');
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    const fresh = await r.json();
    if (my !== seq) return; // a newer response already landed — discard
    // page code on the server changed — reload ourselves
    if (fresh.pageVersion) {
      if (pageVersion && fresh.pageVersion !== pageVersion) { location.reload(); return; }
      pageVersion = fresh.pageVersion;
    }
    data = fresh;
    document.getElementById('error').style.display = 'none';
    const sig = JSON.stringify([fresh.cards, fresh.retire, fresh.team, fresh.lavish,
      fresh.remote, fresh.focusedTab, fresh.windows, fresh.columns]);
    if (noteEditing) {
      // A repaint would wipe the note input mid-typing; the fresh data waits.
      updateReadout();
    } else if (force || sig !== lastRenderSig || Date.now() - lastRenderAt > 60_000) {
      lastRenderSig = sig;
      lastRenderAt = Date.now();
      render();
    } else {
      updateReadout(); // just the clock — no repaint, no flicker
    }
  } catch (e) {
    if (my === seq) showError('herdr not responding: ' + e.message);
  } finally {
    inflight = false;
  }
}

// Check-back date cycles through presets: off → +3 days → +1 week → +2 weeks → off.
// Days are added in calendar space (setDate), so a DST hour shift cannot move
// the stored date by a day.
function nextCheckDate(current) {
  const plus = (days) => {
    const d = new Date(NOW);
    d.setDate(d.getDate() + days);
    return localDate(d.getTime());
  };
  if (!current) return plus(3);
  const diff = Math.round((new Date(current + 'T12:00') - NOW) / 86400000);
  if (diff <= 3) return plus(7);
  if (diff <= 7) return plus(14);
  return null;
}

// Change a field on the server, showing the new value immediately.
async function setField(cwd, patch, apply) {
  data.cards.filter(c => c.cwd === cwd).forEach(apply);
  render();
  try {
    const r = await fetch('/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cwd, ...patch }),
    });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
  } catch (e) {
    showError('save failed: ' + e.message);
  }
  refresh(true);
}

document.addEventListener('click', async (ev) => {
  // A lavish strip opens the review page and must never double as a card click.
  const lavish = ev.target.closest('[data-lavish-url]');
  if (lavish) {
    ev.stopPropagation();
    window.open(lavish.dataset.lavishUrl, '_blank');
    return;
  }
  const deep = ev.target.closest('#deepfocus');
  if (deep) {
    deepFocus = !deepFocus;
    localStorage.setItem('board-deep', deepFocus ? '1' : '');
    // The mode lives on the Mine kanban — arming it elsewhere must act now,
    // not fire silently on some later return to Mine.
    if (deepFocus && view !== 'mine') {
      view = 'mine';
      localStorage.setItem('board-view', view);
    }
    render();
    return;
  }
  const vt = ev.target.closest('.view-tab');
  if (vt) {
    view = vt.dataset.view;
    localStorage.setItem('board-view', view);
    render();
    return;
  }
  const chip = ev.target.closest('.filter-key');
  if (chip) {
    filter = chip.dataset.direction;
    localStorage.setItem('board-filter', filter);
    render();
    return;
  }
  const exp = ev.target.closest('[data-expand]');
  if (exp) {
    const id = exp.dataset.expand;
    if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
    render();
    return;
  }
  const off = ev.target.closest('.power-control');
  if (off) {
    if (!off.dataset.tab) return;
    clearTimeout(pendingOffTimer);
    if (pendingOff !== off.dataset.tab) {
      pendingOff = off.dataset.tab;
      pendingOffTimer = setTimeout(() => { pendingOff = null; render(); }, 6000);
      render();
      return;
    }
    pendingOff = null;
    const c = data.cards.find(x => x.tabId === off.dataset.tab);
    try {
      const r = await fetch('/retire', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          pane: off.dataset.pane, tab: off.dataset.tab, ws: off.dataset.ws,
          hasAgent: !!c?.agent, label: c?.label, wsLabel: c?.wsLabel, cwd: c?.cwd, title: c?.title,
        }),
      });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
    } catch (e) {
      showError('close failed: ' + e.message);
    }
    refresh(true);
    return;
  }
  const star = ev.target.closest('.star-control');
  if (star && star.dataset.cwd) {
    const on = !star.dataset.star;
    setField(star.dataset.cwd, { star: on || null }, c => { c.star = on; });
    return;
  }
  const kind = ev.target.closest('.kind-control');
  if (kind && kind.dataset.cwd) {
    const next = KIND_NEXT[kind.dataset.kind] ?? 'temp';
    setField(kind.dataset.cwd, { kind: next || null }, c => { c.kind = next || null; });
    return;
  }
  const role = ev.target.closest('.role-control');
  if (role && role.dataset.cwd) {
    const next = ROLE_NEXT[role.dataset.role] ?? 'run';
    setField(role.dataset.cwd, { role: next || null }, c => { c.role = next || null; });
    return;
  }
  const pick = ev.target.closest('.focuspick-control');
  if (pick && pick.dataset.cwd) {
    const on = !pick.dataset.focus;
    setField(pick.dataset.cwd, { focus: on || null }, c => { c.focus = on; });
    return;
  }
  const due = ev.target.closest('.date-control');
  if (due && due.dataset.cwd) {
    const next = nextCheckDate(due.dataset.date);
    setField(due.dataset.cwd, { checkDate: next }, c => { c.checkDate = next; });
    return;
  }
  const hide = ev.target.closest('.hide-control');
  if (hide && hide.dataset.cwd) {
    const t = hide.dataset.title;
    setField(hide.dataset.cwd, { hideTitle: t }, c => { if (c.title === t) c.title = ''; });
    return;
  }
  const prio = ev.target.closest('.prio-control');
  if (prio && prio.dataset.cwd) {
    const next = PRIO_NEXT[prio.dataset.prio] || 'P1';
    setField(prio.dataset.cwd, { prio: next }, c => { c.prio = next; });
    return;
  }
  // A click inside the note input is typing, not a jump to the tab under it.
  if (ev.target.closest('.note-input')) return;
  const noteBtn = ev.target.closest('.note-control, [data-note-edit]');
  if (noteBtn) {
    const cwd = noteBtn.dataset.cwd || noteBtn.dataset.noteEdit;
    if (!cwd) return;
    noteEditing = cwd;
    if (noteBtn.dataset.id) expanded.add(noteBtn.dataset.id); // a thin row expands to show the editor
    render();
    const input = document.querySelector('.note-input');
    if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    return;
  }
  const card = ev.target.closest('[data-tab]');
  if (card && card.dataset.tab) {
    try {
      const r = await fetch('/focus', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tab: card.dataset.tab }),
      });
      if (!r.ok) throw new Error((await r.json()).error || r.status);
    } catch (e) {
      showError('jump failed: ' + e.message);
    }
  }
});

// Chrome throttles timers of covered windows — refresh right away on return.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refresh(true);
});
window.addEventListener('focus', () => refresh(true));

// Screenshot-testing helper: ?view=mine&then=team — render the first
// view, then switch to the second one after a second and a half.
const thenView = query.get('then');
if (thenView && VIEWS.includes(thenView)) {
  setTimeout(() => { view = thenView; render(); }, 1500);
}

refresh(true);
// Enter saves the note (empty line clears it), Esc cancels; clicking away
// cancels too — a note changes only when the operator confirms it.
document.addEventListener('keydown', (ev) => {
  const input = ev.target && ev.target.classList?.contains('note-input') ? ev.target : null;
  if (!input) return;
  if (ev.key === 'Enter') {
    const v = input.value.trim().slice(0, 300);
    noteEditing = null;
    setField(input.dataset.cwd, { note: v || null }, c => { c.note = v || null; });
  } else if (ev.key === 'Escape') {
    noteEditing = null;
    render();
  }
});
document.addEventListener('focusout', (ev) => {
  if (ev.target && ev.target.classList?.contains('note-input')) {
    // Give a same-instant Enter keydown a beat to win before the cancel.
    setTimeout(() => { if (noteEditing) { noteEditing = null; render(); } }, 150);
  }
});

setInterval(() => refresh(false), 3000);
</script>
</body>
</html>
